AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Optional IAM Identity Center permission set for direct, temporary S3 evidence
  access. Read-only by default; quarantine upload is an explicit opt-in.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: IAM Identity Center
        Parameters:
          - IdentityCenterInstanceArn
          - PermissionSetName
          - CreateAccountAssignment
          - TargetAccountId
          - PrincipalType
          - PrincipalId
      - Label:
          default: Exact evidence boundary
        Parameters:
          - EvidenceBucketName
          - IngestBucketName
          - KmsKeyArn
          - TenantId
          - EnableQuarantineUpload
    ParameterLabels:
      EnableQuarantineUpload:
        default: Permit one-part SSE-KMS uploads to quarantine
      PrincipalId:
        default: Identity Store user or group ID

Parameters:
  IdentityCenterInstanceArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):sso:::instance/(sso)?ins-[A-Za-z0-9-.]{16}$"
  PermissionSetName:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"
    Description: Use a tenant-specific name, for example ScopeproofAcmeRead.
  EvidenceBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  IngestBucketName:
    Type: String
    Default: ""
    MaxLength: 63
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Required only when quarantine upload is enabled.
  KmsKeyArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):kms:[a-z0-9-]+:[0-9]{12}:key/([0-9a-fA-F-]{36}|mrk-[0-9a-fA-F]{32})$"
    ConstraintDescription: Supply an immutable customer-managed KMS key ARN, not an alias.
  TenantId:
    Type: String
    AllowedPattern: "^ten_[a-f0-9]{32}$"
  EnableQuarantineUpload:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  CreateAccountAssignment:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  TargetAccountId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{12}$"
  PrincipalType:
    Type: String
    Default: GROUP
    AllowedValues:
      - GROUP
      - USER
  PrincipalId:
    Type: String
    Default: ""
    MaxLength: 128
    AllowedPattern: "^$|^[A-Za-z0-9-]{10,128}$"

Rules:
  RequireIngestBucketForUpload:
    RuleCondition:
      Fn::Equals:
        - Ref: EnableQuarantineUpload
        - "true"
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: IngestBucketName
                - ""
        AssertDescription: IngestBucketName is required when quarantine upload is enabled.
  RequireAssignmentInputs:
    RuleCondition:
      Fn::Equals:
        - Ref: CreateAccountAssignment
        - "true"
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: TargetAccountId
                - ""
        AssertDescription: TargetAccountId is required when creating an assignment.
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: PrincipalId
                - ""
        AssertDescription: PrincipalId is required when creating an assignment.

Conditions:
  AllowQuarantineUpload:
    Fn::Equals:
      - Ref: EnableQuarantineUpload
      - "true"
  ShouldCreateAssignment:
    Fn::Equals:
      - Ref: CreateAccountAssignment
      - "true"

Resources:
  EvidencePermissionSet:
    Type: AWS::SSO::PermissionSet
    Properties:
      InstanceArn:
        Ref: IdentityCenterInstanceArn
      Name:
        Ref: PermissionSetName
      Description: Scopeproof tenant-scoped evidence access; direct S3 is secondary to presigning.
      SessionDuration: PT1H
      Tags:
        - Key: Application
          Value: scopeproof
        - Key: TenantId
          Value:
            Ref: TenantId
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: ListExactEvidencePrefix
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}
            Condition:
              StringLike:
                s3:prefix:
                  - Fn::Sub: tenants/${TenantId}/controls/*/evidence/*
          - Sid: ReadExactEvidencePrefix
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}/tenants/${TenantId}/controls/*/evidence/*
          - Sid: DenyObjectReadsOutsideExactEvidencePrefix
            Effect: Deny
            Action:
              - s3:GetObject*
            NotResource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}/tenants/${TenantId}/controls/*/evidence/*
          - Sid: DenyListWithoutPrefix
            Effect: Deny
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::*
            Condition:
              "Null":
                s3:prefix: "true"
          - Sid: DenyListOutsideExactEvidencePrefix
            Effect: Deny
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::*
            Condition:
              StringNotLike:
                s3:prefix:
                  - Fn::Sub: tenants/${TenantId}/controls/*/evidence/*
          - Sid: DecryptEvidenceThroughS3Only
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - Ref: KmsKeyArn
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: s3.${AWS::Region}.${AWS::URLSuffix}
                kms:EncryptionContext:scopeproofTenantId:
                  Ref: TenantId
                kms:EncryptionContext:scopeproofPurpose: immutable-evidence
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: WriteExactQuarantinePrefix
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}/tenants/${TenantId}/controls/*/quarantine/*
                Condition:
                  StringEquals:
                    s3:x-amz-server-side-encryption: aws:kms
                    s3:x-amz-server-side-encryption-aws-kms-key-id:
                      Ref: KmsKeyArn
              - Ref: AWS::NoValue
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: GenerateQuarantineDataKeyThroughS3Only
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                Resource:
                  - Ref: KmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService:
                      Fn::Sub: s3.${AWS::Region}.${AWS::URLSuffix}
                    kms:EncryptionContext:scopeproofTenantId:
                      Ref: TenantId
                    kms:EncryptionContext:scopeproofPurpose: quarantine
              - Ref: AWS::NoValue
          - Sid: DenyS3OverInsecureTransport
            Effect: Deny
            Action:
              - s3:*
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyEvidenceDestructiveActions
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:BypassGovernanceRetention
              - s3:PutObjectAcl
              - s3:PutObjectLegalHold
              - s3:PutObjectRetention
              - s3:RestoreObject
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}/tenants/${TenantId}/controls/*/evidence/*
          - Sid: DenyEvidenceWrites
            Effect: Deny
            Action:
              - s3:PutObject
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${EvidenceBucketName}/tenants/${TenantId}/controls/*/evidence/*
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: DenyQuarantineOverInsecureTransport
                Effect: Deny
                Action:
                  - s3:*
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}/*
                Condition:
                  Bool:
                    aws:SecureTransport: "false"
              - Ref: AWS::NoValue
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: DenyQuarantineDestructiveActions
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:BypassGovernanceRetention
                  - s3:PutObjectAcl
                  - s3:PutObjectLegalHold
                  - s3:PutObjectRetention
                  - s3:RestoreObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}/tenants/${TenantId}/controls/*/quarantine/*
              - Ref: AWS::NoValue
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: DenyQuarantinePutWithoutSseKms
                Effect: Deny
                Action:
                  - s3:PutObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}/tenants/${TenantId}/controls/*/quarantine/*
                Condition:
                  StringNotEquals:
                    s3:x-amz-server-side-encryption: aws:kms
              - Ref: AWS::NoValue
          - Fn::If:
              - AllowQuarantineUpload
              - Sid: DenyQuarantinePutWithWrongKmsKey
                Effect: Deny
                Action:
                  - s3:PutObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${IngestBucketName}/tenants/${TenantId}/controls/*/quarantine/*
                Condition:
                  StringNotEquals:
                    s3:x-amz-server-side-encryption-aws-kms-key-id:
                      Ref: KmsKeyArn
              - Ref: AWS::NoValue
          - Sid: DenyKmsOutsideRegionalS3
            Effect: Deny
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource:
              - Ref: KmsKeyArn
            Condition:
              StringNotEquals:
                kms:ViaService:
                  Fn::Sub: s3.${AWS::Region}.${AWS::URLSuffix}
          - Sid: DenyKmsUseOutsideConfiguredKey
            Effect: Deny
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            NotResource:
              - Ref: KmsKeyArn
          - Sid: DenyWrongTenantEncryptionContext
            Effect: Deny
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource:
              - Ref: KmsKeyArn
            Condition:
              StringNotEquals:
                kms:EncryptionContext:scopeproofTenantId:
                  Ref: TenantId
          - Sid: DenyWrongEvidencePurposeEncryptionContext
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource:
              - Ref: KmsKeyArn
            Condition:
              StringNotEquals:
                kms:EncryptionContext:scopeproofPurpose: immutable-evidence
          - Sid: DenyWrongQuarantinePurposeEncryptionContext
            Effect: Deny
            Action:
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource:
              - Ref: KmsKeyArn
            Condition:
              StringNotEquals:
                kms:EncryptionContext:scopeproofPurpose: quarantine

  OptionalAccountAssignment:
    Type: AWS::SSO::Assignment
    Condition: ShouldCreateAssignment
    Properties:
      InstanceArn:
        Ref: IdentityCenterInstanceArn
      PermissionSetArn:
        Fn::GetAtt:
          - EvidencePermissionSet
          - PermissionSetArn
      PrincipalId:
        Ref: PrincipalId
      PrincipalType:
        Ref: PrincipalType
      TargetId:
        Ref: TargetAccountId
      TargetType: AWS_ACCOUNT

Outputs:
  PermissionSetArn:
    Value:
      Fn::GetAtt:
        - EvidencePermissionSet
        - PermissionSetArn
  AccountAssignmentId:
    Condition: ShouldCreateAssignment
    Value:
      Ref: OptionalAccountAssignment
  RequiredEvidenceEncryptionContextJson:
    Description: Non-secret context that must have been stored with readable evidence.
    Value:
      Fn::Sub: '{"scopeproofPurpose":"immutable-evidence","scopeproofTenantId":"${TenantId}"}'
  RequiredQuarantineEncryptionContextJson:
    Condition: AllowQuarantineUpload
    Description: Non-secret context the uploader must send with each SSE-KMS upload.
    Value:
      Fn::Sub: '{"scopeproofPurpose":"quarantine","scopeproofTenantId":"${TenantId}"}'
  RequiredQuarantineEncryptionContextBase64:
    Condition: AllowQuarantineUpload
    Description: Base64-encoded x-amz-server-side-encryption-context header value.
    Value:
      Fn::Base64:
        Fn::Sub: '{"scopeproofPurpose":"quarantine","scopeproofTenantId":"${TenantId}"}'
