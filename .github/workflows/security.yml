name: Security verification

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Block vulnerable or disallowed new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later,GPL-2.0-only,GPL-2.0-or-later,GPL-3.0-only,GPL-3.0-or-later,SSPL-1.0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Replay database migrations
        run: ./Scripts/verify_migrations.sh
      - name: Block High and Critical dependency advisories
        run: npm audit --audit-level=high
      - name: Verify the production dependency graph independently
        run: npm audit --omit=dev --audit-level=high
      - name: Enable the pinned AWS infrastructure package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - name: Validate and synthesize the AWS CDK foundation
        working-directory: infra/aws/cdk
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run synth
          pnpm audit --audit-level high
      - name: Generate complete CycloneDX dependency SBOMs
        run: |
          npm sbom --sbom-format=cyclonedx > scopeproof-worker-sbom.cdx.json
          node Scripts/pnpm_lock_to_cyclonedx.mjs infra/aws/cdk/package.json infra/aws/cdk/pnpm-lock.yaml scopeproof-aws-cdk-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-dependency-sboms
          path: |
            scopeproof-worker-sbom.cdx.json
            scopeproof-aws-cdk-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test native application
        working-directory: macos/ScopeproofCapture
        run: swift test --arch arm64
      - name: Build development application
        run: ./Scripts/build_macos_capture.sh
      - name: Verify bundle metadata and signature
        run: |
          codesign --verify --deep --strict "DerivedData/Scopeproof Capture.app"
          test "$(defaults read "$PWD/DerivedData/Scopeproof Capture.app/Contents/Info" CFBundleIdentifier)" = "com.scopeproof.capture"
          ditto -c -k --sequesterRsrc --keepParent "DerivedData/Scopeproof Capture.app" "DerivedData/Scopeproof-Capture-development.zip"
          shasum -a 256 "DerivedData/Scopeproof-Capture-development.zip" > "DerivedData/Scopeproof-Capture-development.zip.sha256"
      - name: Build and verify development-preview DMG
        run: ./Scripts/build_development_dmg.sh --skip-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-macos-development
          path: |
            DerivedData/Scopeproof-Capture-development.zip
            DerivedData/Scopeproof-Capture-development.zip.sha256
            DerivedData/Scopeproof-Capture-*-development-preview.dmg
            DerivedData/Scopeproof-Capture-*-development-preview.dmg.sha256
          if-no-files-found: error
          retention-days: 14
