name: macOS production release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-component version already committed in Info.plist
        required: true
        type: string
      build_number:
        description: Positive CFBundleVersion already committed in Info.plist
        required: true
        type: string
      expected_commit:
        description: Full approved 40-character commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the approved source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the immutable release input
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Select the release evidence runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Require successful security workflows for the exact commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in security.yml codeql-swift.yml; do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$EXPECTED_COMMIT&status=completed&per_page=100" \
              | EXPECTED_COMMIT="$EXPECTED_COMMIT" WORKFLOW="$workflow" node --input-type=module -e '
                  const chunks = [];
                  for await (const chunk of process.stdin) chunks.push(chunk);
                  const body = JSON.parse(Buffer.concat(chunks).toString("utf8"));
                  const approved = Array.isArray(body.workflow_runs) && body.workflow_runs.some((run) =>
                    run.head_sha === process.env.EXPECTED_COMMIT &&
                    run.head_branch === "main" &&
                    run.event === "push" &&
                    run.status === "completed" &&
                    run.conclusion === "success"
                  );
                  if (!approved) throw new Error(`${process.env.WORKFLOW} has no successful main push run for the approved commit.`);
                '
          done

      - name: Test the native release source
        working-directory: macos/ScopeproofCapture
        run: swift test --arch arm64

      - name: Compile the credential-free prepared candidate
        env:
          SCOPEPROOF_RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          SCOPEPROOF_RELEASE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SCOPEPROOF_RELEASE_PREPARED_OUTPUT_DIR: DerivedData/Prepared
          SCOPEPROOF_RELEASE_VERSION: ${{ inputs.version }}
        run: ./Scripts/prepare_macos_release_candidate.sh

      - name: Upload the prepared candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-macos-prepared-${{ github.sha }}
          path: |
            DerivedData/Prepared/Scopeproof-Capture-prepared.zip
            DerivedData/Prepared/Scopeproof-Capture-prepared.zip.sha256
          if-no-files-found: error
          retention-days: 1

  sign-notarize:
    needs: prepare-release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: production-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out signing policy without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the credential-free prepared candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scopeproof-macos-prepared-${{ github.sha }}
          path: DerivedData/Prepared

      - name: Verify the handoff before loading release credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -f DerivedData/Prepared/Scopeproof-Capture-prepared.zip
          test ! -L DerivedData/Prepared/Scopeproof-Capture-prepared.zip
          test -f DerivedData/Prepared/Scopeproof-Capture-prepared.zip.sha256
          test ! -L DerivedData/Prepared/Scopeproof-Capture-prepared.zip.sha256
          test "$(find DerivedData/Prepared -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          cd DerivedData/Prepared
          shasum -a 256 -c Scopeproof-Capture-prepared.zip.sha256

      - name: Import the Developer ID identity into an ephemeral Keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          RELEASE_TEAM_ID: ${{ secrets.MACOS_RELEASE_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          for secret_name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY_P8_BASE64 NOTARY_ISSUER_ID NOTARY_KEY_ID RELEASE_TEAM_ID; do
            test -n "${!secret_name:-}"
          done
          [[ "$NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$NOTARY_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "$RELEASE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]

          keychain="$RUNNER_TEMP/scopeproof-release-${GITHUB_RUN_ID}.keychain-db"
          password_file="$RUNNER_TEMP/scopeproof-keychain-password"
          p12_file="$RUNNER_TEMP/scopeproof-developer-id.p12"
          api_key_file="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          profile="scopeproof-production-${GITHUB_RUN_ID}"
          cleanup_import_files() { rm -f "$p12_file" "$api_key_file" "$password_file"; }
          trap cleanup_import_files EXIT HUP INT TERM

          /usr/bin/openssl rand -base64 48 > "$password_file"
          chmod 0600 "$password_file"
          keychain_password="$(<"$password_file")"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$p12_file"
          chmod 0600 "$p12_file"
          security import "$p12_file" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null

          identity_count="$(security find-identity -v -p codesigning "$keychain" | grep -c '"Developer ID Application:' || true)"
          test "$identity_count" = "1"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          [[ "$identity" == "Developer ID Application: "*" ($RELEASE_TEAM_ID)" ]]
          [[ "$identity" != *$'\n'* && "$identity" != *$'\r'* ]]

          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key_file"
          chmod 0600 "$api_key_file"
          xcrun notarytool store-credentials "$profile" \
            --key "$api_key_file" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain" >/dev/null

          rm -f "$p12_file" "$api_key_file" "$password_file"
          {
            echo "SCOPEPROOF_CODESIGN_IDENTITY=$identity"
            echo "SCOPEPROOF_NOTARY_KEYCHAIN=$keychain"
            echo "SCOPEPROOF_NOTARY_PROFILE=$profile"
          } >> "$GITHUB_ENV"

      - name: Sign and notarize the prebuilt candidate without invoking a compiler
        env:
          SCOPEPROOF_RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          SCOPEPROOF_RELEASE_OUTPUT_DIR: DerivedData/Production
          SCOPEPROOF_RELEASE_PREPARED_ARCHIVE: DerivedData/Prepared/Scopeproof-Capture-prepared.zip
          SCOPEPROOF_RELEASE_PREPARED_CHECKSUM: DerivedData/Prepared/Scopeproof-Capture-prepared.zip.sha256
          SCOPEPROOF_RELEASE_TEAM_ID: ${{ secrets.MACOS_RELEASE_TEAM_ID }}
          SCOPEPROOF_RELEASE_VERSION: ${{ inputs.version }}
        run: ./Scripts/build_macos_production_release.sh

      - name: Destroy temporary release credentials before artifact actions
        if: always()
        run: |
          set -euo pipefail
          set +x
          security default-keychain -d user -s login.keychain-db
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
          keychain="${SCOPEPROOF_NOTARY_KEYCHAIN:-$RUNNER_TEMP/scopeproof-release-${GITHUB_RUN_ID}.keychain-db}"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          test ! -e "$keychain"
          rm -f \
            "$RUNNER_TEMP/scopeproof-keychain-password" \
            "$RUNNER_TEMP/scopeproof-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload the signed candidate for isolated attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-macos-signed-${{ github.sha }}
          path: |
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.notary-receipt.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.sbom.cdx.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.provenance.intoto.json
          if-no-files-found: error
          retention-days: 1

  attest-release:
    needs: sign-notarize
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the signed candidate without release credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scopeproof-macos-signed-${{ github.sha }}
          path: DerivedData/Production

      - name: Verify the exact signed artifact set
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          stem="Scopeproof-Capture-$RELEASE_VERSION"
          expected="$stem.dmg
          $stem.dmg.sha256
          $stem.notary-receipt.json
          $stem.provenance.intoto.json
          $stem.sbom.cdx.json
          $stem.zip
          $stem.zip.sha256"
          actual="$(find DerivedData/Production -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(find DerivedData/Production -mindepth 1 -maxdepth 1 -type l | wc -l | tr -d ' ')" = "0"
          cd DerivedData/Production
          shasum -a 256 -c "$stem.zip.sha256"
          shasum -a 256 -c "$stem.dmg.sha256"

      - name: Attest the signed release candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.notary-receipt.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.sbom.cdx.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.provenance.intoto.json

      - name: Upload the attested release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-macos-production-${{ inputs.version }}-${{ github.sha }}
          path: |
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.zip.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.dmg.sha256
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.notary-receipt.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.sbom.cdx.json
            DerivedData/Production/Scopeproof-Capture-${{ inputs.version }}.provenance.intoto.json
          if-no-files-found: error
          retention-days: 30
